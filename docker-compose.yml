services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: placetrack_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-placetrack_db}
      POSTGRES_USER: ${DB_USER:-placetrack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-placetrack_secure_pass_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-placetrack_user} -d ${DB_NAME:-placetrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Web Application Service (Gunicorn + WhiteNoise)
  web:
    build: .
    container_name: placetrack_web
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py seed_jobs &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 placetrack.wsgi:application"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-placetrack_db}
      - DB_USER=${DB_USER:-placetrack_user}
      - DB_PASSWORD=${DB_PASSWORD:-placetrack_secure_pass_123}
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
